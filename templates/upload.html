<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - FX Master</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        form { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        input, button { padding: 12px; font-size: 16px; border-radius: 5px; border: none; }
        input[type="file"] { background: #222; color: #fff; }
        button { background: #ff0050; color: #fff; font-weight: bold; cursor: pointer; }
        .back { color: #aaa; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>
    <h2>Upload Video from Gallery</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="caption" placeholder="Enter caption / hashtags..." required>
        <input type="file" name="video_file" accept="video/*" required>
        <button type="submit">Post Video</button>
    </form>
    <a href="/" class="back">Back to Home</a>
</body>
</html>
