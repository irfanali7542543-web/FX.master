<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - FX Master</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
.upload-card{width:90%;max-width:400px;background:#111;padding:25px;border-radius:12px;border:1px solid #333;text-align:center}
input{width:100%;padding:12px;margin-bottom:15px;background:#222;border:1px solid #444;color:#fff;border-radius:6px;box-sizing:border-box}
.post-btn{width:100%;background:#ff0050;color:#fff;border:none;padding:12px;border-radius:6px;font-size:16px;font-weight:bold}
#msg{margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="upload-card">
<h2>Upload Video</h2>
<input type="text" id="caption" placeholder="Caption (optional)">
<input type="file" id="videoFile" accept="video/*">
<button id="btn" class="post-btn" onclick="uploadVideo()">Post Video</button>
<div id="msg" style="color:#ff0050">Ready to upload</div>
<a href="/" style="display:block;margin-top:15px;color:#888;text-decoration:none">← Back to Home</a>
</div>

<script>
const SUPABASE_URL = "https://dnarnrqlmrexrpnmdinx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vp7kq-sNHQxL3E4MDmHFcw_HZ-p-fG1";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function uploadVideo(){
  const fileInput = document.getElementById('videoFile');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  if(fileInput.files.length==0){ alert("Bhai video select karo!"); return; }
  const file = fileInput.files[0];
  const fileName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  btn.disabled=true;
  btn.innerText="Uploading...";
  msg.innerText="Upload ho raha hai...";
  const { error } = await supabaseClient.storage.from("videos").upload(fileName, file);
  if(error){
    msg.style.color="#f00";
    msg.innerText="Failed: " + error.message;
    btn.disabled=false;
    btn.innerText="Post Video";
  } else {
    msg.style.color="#0f0";
    msg.innerText="Success! Video hamesha ke liye save ho gaya!";
    setTimeout(()=>{ window.location.href="/"; }, 1000);
  }
}
</script>
</body>
</html>
