<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - FX Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111; font-size: 16px; font-weight: bold; }
        .close-btn { color: #aaa; text-decoration: none; font-size: 20px; }
        .upload-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .upload-box { border: 2px dashed #444; border-radius: 15px; padding: 30px; text-align: center; width: 100%; max-width: 350px; cursor: pointer; margin-bottom: 20px; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-text { font-size: 13px; color: #aaa; }
        .file-input { display: none; }
        .file-name { font-size: 12px; color: #00f2fe; word-break: break-all; margin-top: 10px; }
        .post-btn { background: linear-gradient(135deg, #00f2fe 0%, #ff0050 100%); color: #fff; border: none; padding: 12px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 350px; }
        .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-box { color: #ff0050; font-size: 12px; margin-top: 10px; text-align: center; }
        .loader { display: none; width: 24px; height: 24px; border: 3px solid #fff; border-top: 3px solid #ff0050; border-radius: 50%; animation: rotation 1s linear infinite; margin: 15px auto; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #111; padding: 10px 0; border-top: 1px solid #222; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; text-align: center; }
        .bottom-nav a.active { color: #fff; font-weight: bold; }
        .plus-btn { background: linear-gradient(135deg, #00f2fe 0%, #ff0050 100%); color: #fff; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-top: -8px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="close-btn">X</a>
        <span>New Video Post</span>
        <span></span>
    </div>

    <div class="upload-container">
        <label for="videoFile" class="upload-box">
            <div class="upload-icon">📁</div>
            <div class="upload-text" id="uploadLabelText">Tap to select video from Gallery</div>
            <div class="file-name" id="fileNameDisplay"></div>
        </label>
        <input type="file" id="videoFile" class="file-input" accept="video/*" onchange="handleFileSelect(event)">
        
        <button id="postBtn" class="post-btn" onclick="uploadVideo()" disabled>Post to Feed</button>
        <div class="loader" id="loadingSpinner"></div>
        <div class="error-box" id="errorDisplay"></div>
    </div>

    <div class="bottom-nav">
        <a href="/">🏠 Home</a>
        <a href="/group">👥 Official Group</a>
        <a href="/upload"><div class="plus-btn">+</div></a>
        <a href="/inbox">🎂 Inbox</a>
        <a href="/profile">👤 Profile</a>
    </div>

    <script>
        const SUPABASE_URL = "https://dnarnrqlmrexrpnmdinx.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Vp7kq-sNHQxL3E4MDmHFcw_HZ-p-fG1";

        let selectedFile = null;

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('fileNameDisplay').innerText = 'Selected: ' + selectedFile.name;
                document.getElementById('uploadLabelText').innerText = 'Change Video';
                document.getElementById('postBtn').disabled = false;
            }
        }

        async function uploadVideo() {
            if (!selectedFile) return;

            document.getElementById('postBtn').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('errorDisplay').innerText = '';

            try {
                const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const fileName = 'video_' + Date.now() + '_' + selectedFile.name;

                // 1. Upload video to storage bucket 'video'
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('video')
                    .upload(fileName, selectedFile);

                if (uploadError) throw uploadError;

                // 2. Get Public URL of the uploaded video
                const { data: publicURLData } = supabaseClient.storage
                    .from('video')
                    .getPublicUrl(fileName);

                const videoUrl = publicURLData.publicUrl;

                // 3. Save URL and Caption to the 'Video' table
                const { error: dbError } = await supabaseClient
                    .from('Video')
                    .insert([
                        { video_url: videoUrl, caption: "Live Market Signal & Analysis" }
                    ]);

                if (dbError) throw dbError;

                alert('Video successfully uploaded and posted to feed!');
                window.location.href = '/';

            } catch (err) {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('postBtn').style.display = 'block';
                document.getElementById('errorDisplay').innerText = 'Supabase Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
