<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Signal Post - FX Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #ffffff;
        }
        .post-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        /* Top Navigation Bar */
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
            text-decoration: none;
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
        }
        .post-submit-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        /* Textarea Section */
        .input-section {
            flex: 1;
            padding: 16px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
        }
        .post-textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        .post-textarea::placeholder {
            color: #64748b;
        }
        /* Audience Selector */
        .audience-bar {
            padding: 10px 16px;
            font-size: 13px;
            color: #38bdf8;
            border-top: 1px solid #1e293b;
            border-bottom: 1px solid #1e293b;
            background: #1e293b;
        }
        /* Bottom Media Toolbar */
        .media-toolbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
        .tool-icon {
            font-size: 20px;
            cursor: pointer;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="post-container">
        <!-- Top Bar -->
        <div class="post-header">
            <a href="/" class="close-btn">✕</a>
            <span class="header-title">New Signal Post</span>
            <button class="post-submit-btn" onclick="alert('Signal broadcasted successfully!')">Post</button>
        </div>

        <!-- Text Input Area -->
        <div class="input-section">
            <textarea class="post-textarea" placeholder="What's happening in XAUUSD / BTC market? Add analysis..."></textarea>
        </div>

        <!-- Audience Info -->
        <div class="audience-bar">
            🌐 Everyone can reply
        </div>

        <!-- Media & Photo Toolbar -->
        <div class="media-toolbar">
            <label class="tool-icon" title="Upload Photo">
                🖼️
                <input type="file" accept="image/*" style="display: none;">
            </label>
            <div class="tool-icon" title="Camera">📷</div>
            <div class="tool-icon" title="Chart Analysis">📊</div>
            <div class="tool-icon" title="GIF">GIF</div>
            <div class="tool-icon" title="Location">📍</div>
        </div>
    </div>

</body>
</html>
