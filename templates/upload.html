<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - FX Master</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        form { margin-top: 50px; display: flex; flex-direction: column; gap: 15px; }
        input, button { padding: 12px; font-size: 16px; border-radius: 5px; border: none; }
        button { background: #ff0050; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Upload New Trading Video</h2>
    <form method="POST">
        <input type="text" name="caption" placeholder="Enter caption / hashtags..." required>
        <input type="text" name="video_url" placeholder="Video Direct URL (mp4)" value="https://www.w3schools.com/html/mov_bbb.mp4" required>
        <button type="submit">Post Video</button>
    </form>
    <br><a href="/" style="color: #fff;">Back to Home</a>
</body>
</html>
