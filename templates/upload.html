<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - FX Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
       .upload-card { width: 90%; max-width: 400px; background: #111; padding: 25px; border-radius: 12px; border: 1px solid #333; text-align: center; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
       .post-btn { width: 100%; background: #ff0050; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
       .post-btn:disabled { background: #555; }
        #msg { margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="upload-card">
        <h2>Upload Video</h2>
        <input type="text" id="caption" placeholder="Caption (optional)">
        <input type="file" id="videoFile" accept="video/*">
        <button id="submitBtn" class="post-btn" onclick="uploadVideo()">Post Video</button>
        <div id="msg"></div>
        <a href="/" style="display:block; margin-top:15px; color:#888; text-decoration:none;">← Back to Home</a>
    </div>
    <script>
        const SUPABASE_URL = "https://dnarnrqlmrexrpnmdinx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Vp7kq-sNHQX3E4MDmHFcw_HZ-p-fG1";
        const BUCKET_NAME = "videos";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function uploadVideo() {
            const fileInput = document.getElementById('videoFile');
            const captionInput = document.getElementById('caption');
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');

            if (fileInput.files.length === 0) { alert("Video select karo bhai!"); return; }
            const file = fileInput.files[0];
            const fileName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");

            btn.disabled = true; btn.innerText = "Uploading..."; msg.innerText = "Upload ho raha hai, intezar karo..."; msg.style.color = "#ff0050";

            try {
                const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file, { upsert: true });
                if (error) throw error;
                msg.innerText = "Upload Success! Home pe ja raha hu..."; msg.style.color = "#0f0";
                setTimeout(() => { window.location.href = '/'; }, 1000);
            } catch (err) {
                console.log(err);
                msg.innerText = "Failed: " + err.message + " | Supabase Bucket ko PUBLIC karo aur Policy me INSERT allow karo";
                msg.style.color = "#f00";
                btn.disabled = false; btn.innerText = "Post Video";
            }
        }
    </script>
</body>
</html>
