<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Group - FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; }
        .header { padding: 15px; font-size: 18px; font-weight: bold; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .group-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .group-card { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #222; display: flex; align-items: center; gap: 15px; }
        .group-avatar { width: 50px; height: 50px; background: #ff0050; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .group-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .group-info p { margin: 0; color: #888; font-size: 13px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; border-top: 1px solid #1a1a1a; padding: 10px 0; z-index: 1000; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .bottom-nav a.active { color: #fff; font-weight: bold; }
        .plus-btn { background: linear-gradient(135deg, #00f2fe 0%, #ff0050 100%); color: #fff; width: 42px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">Official Group</div>
    <div class="group-container">
        <div class="group-card">
            <div class="group-avatar">FX</div>
            <div class="group-info">
                <h3>FX Master VIP Community</h3>
                <p>Join our official trading signals & updates group.</p>
            </div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="/">🏠 Home</a>
        <a href="/group" class="active">👥 Official Group</a>
        <a href="/upload"><div class="plus-btn">+</div></a>
        <a href="/inbox">💬 Chats</a>
        <a href="/profile">👤 Me</a>
    </div>
</body>
</html>
