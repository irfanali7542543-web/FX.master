<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - For You</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding-top: 50px;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        /* Top Tabs styling */
        .top-tabs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }
        .top-tab {
            color: #94a3b8;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding-bottom: 4px;
        }
        .top-tab.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }

        /* Fullscreen TikTok style container */
        .feed-container {
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            text-align: center;
        }
        .video-card {
            background: #1e293b;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Top Tabs -->
    <div class="top-tabs">
        <a href="/" class="top-tab">Forex</a>
        <a href="/for-you" class="top-tab active">For You</a>
    </div>

    <!-- For You Dedicated Fullscreen Feed -->
    <div class="feed-container">
        <div class="video-card">
            <i class="fas fa-video" style="font-size: 48px; color: #38bdf8; margin-bottom: 15px;"></i>
            <h3 style="margin-bottom: 10px;">For You Feed</h3>
            <p style="color: #94a3b8;">Yahan aapka TikTok style short-video aur interactive posts ka alag feed chalega.</p>
        </div>
    </div>

</body>
</html>
