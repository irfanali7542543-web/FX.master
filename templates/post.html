<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create Post</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body, html{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}

/* Center Upload Box */
.post-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
.upload-card{background:#111;border:2px dashed #333;border-radius:16px;padding:30px 20px;width:100%;max-width:320px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;transition:0.3s;}
.upload-card:hover{border-color:#fe2c55;}
.upload-icon{font-size:48px;color:#fe2c55;}
.upload-title{font-size:16px;font-weight:bold;color:#fff;}
.upload-subtitle{font-size:12px;color:#888;}

/* Preview Area */
#preview-container{margin-top:15px;max-width:100%;max-height:200px;border-radius:8px;overflow:hidden;display:none;}
#preview-container img, #preview-container video{width:100%;max-height:180px;object-fit:cover;border-radius:8px;}

/* Bottom Navigation Bar */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:999;}
.nav-item{color:#8e8e8e;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:11px;}
.nav-item i{font-size:20px;margin-bottom:3px;}
.nav-item.active{color:#fff;}
.post-btn{background:linear-gradient(45deg,#00f2fe,#4facfe);color:#000;width:42px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;}
</style>
</head>
<body>

<div class="post-container">
  <div class="upload-card" onclick="document.getElementById('mediaInput').click()">
    <i class="fas fa-cloud-upload-alt upload-icon"></i>
    <div class="upload-title">Upload Photo or Video</div>
    <div class="upload-subtitle">Tap to open gallery</div>
    <!-- Hidden File Input supporting both images and videos -->
    <input type="file" id="mediaInput" style="display:none;" accept="image/*,video/*" onchange="handleFileSelect(event)">
  </div>
  <div id="preview-container"></div>
</div>

<script>
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file) {
    const previewContainer = document.getElementById('preview-container');
    previewContainer.style.display = 'block';
    previewContainer.innerHTML = '';
    
    const fileURL = URL.createObjectURL(file);
    if (file.type.startsWith('video/')) {
      const vid = document.createElement('video');
      vid.src = fileURL;
      vid.controls = true;
      previewContainer.appendChild(vid);
    } else {
      const img = document.createElement('img');
      img.src = fileURL;
      previewContainer.appendChild(img);
    }
  }
}
</script>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
  <a href="/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/group" class="nav-item"><i class="fas fa-users"></i><span>Group</span></a>
  <a href="/post" class="nav-item post-btn active"><i class="fas fa-plus"></i></a>
  <a href="/inbox" class="nav-item"><i class="fas fa-comment-dots"></i><span>Inbox</span></a>
  <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</div>

</body>
</html>
