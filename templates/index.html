<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding-top: 50px;
            padding-bottom: 70px;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        /* Top Tabs styling */
        .top-tabs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }
        .top-tab {
            color: #94a3b8;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }
        .top-tab.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 4px;
        }

        .content-section {
            padding: 15px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Top Tabs -->
    <div class="top-tabs">
        <a href="/" class="top-tab active">Forex</a>
        <a href="/for-you" class="top-tab">For You</a>
    </div>

    <!-- Main Content -->
    <div class="content-section">
        <div style="background: #1e293b; padding: 15px; border-radius: 8px;">
            <div style="font-weight: bold; margin-bottom: 5px;">fx_master034211</div>
            <div>ETHUSD SELL ENTRY 2640</div>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Only on Forex/Home page) -->
    <div class="bottom-nav">
        <a href="/" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="/market" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Market</span>
        </a>
        <a href="/for-you" class="nav-item">
            <i class="fas fa-video"></i>
            <span>For You</span>
        </a>
        <a href="/profile" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
        <a href="/channel" class="nav-item">
            <i class="fas fa-bullhorn"></i>
            <span>Channel</span>
        </a>
    </div>

</body>
</html>
