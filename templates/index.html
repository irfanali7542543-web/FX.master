<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .video-container { height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .footer { position: absolute; bottom: 60px; left: 15px; z-index: 10; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; padding: 12px 0; border-top: 1px solid #333; z-index: 100; }
        .nav a { color: #fff; text-decoration: none; font-size: 14px; }
        .nav .plus { background: #ff0050; padding: 5px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="feed">
        {% for video in videos %}
        <div class="video-container">
            <video src="{{ video.url }}" autoplay loop muted playsinline></video>
            <div class="footer">
                <h3>{{ video.username }}</h3>
                <p>{{ video.caption }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/friends">Friends</a>
        <a href="/upload" class="plus">+</a>
        <a href="/inbox">Inbox</a>
        <a href="/profile">Profile</a>
    </div>
</body>
</html>
