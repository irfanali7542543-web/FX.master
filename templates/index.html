<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .feed { text-align: center; color: #888; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; border-top: 1px solid #222; padding: 12px 0; z-index: 1000; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 14px; }
        .bottom-nav a.active { color: #fff; font-weight: bold; }
        .plus-btn { background: #ff0050; color: #fff; padding: 6px 18px; border-radius: 6px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="feed">
        <h2>Welcome to FX Master</h2>
        <p>Your video feed is ready.</p>
    </div>
    <div class="bottom-nav">
        <a href="/" class="active">Home</a>
        <a href="/friends">Friends</a>
        <a href="/upload" class="plus-btn">+</a>
        <a href="/inbox">Inbox</a>
        <a href="/profile">Profile</a>
    </div>
</body>
</html>
