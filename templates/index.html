<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        .video-container { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #000; }
        
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .footer { position: absolute; bottom: 70px; left: 15px; z-index: 10; max-width: 75%; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .footer h3 { margin: 0 0 5px 0; font-size: 16px; }
        .footer p { margin: 0; font-size: 14px; word-break: break-word; }
        
        .sidebar { position: absolute; right: 15px; bottom: 90px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10; }
        .sidebar-item { text-align: center; cursor: pointer; color: #fff; font-size: 11px; z-index: 15; user-select: none; }
        .icon-btn { width: 44px; height: 44px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; margin-bottom: 2px; border: 1px solid rgba(255,255,255,0.2); }
        .profile-badge { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #333; margin-bottom: 2px; }
        .profile-badge img { width: 100%; height: 100%; object-fit: cover; }

        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; padding: 12px 0; border-top: 1px solid #222; z-index: 100; }
        .nav a { color: #888; text-decoration: none; font-size: 14px; font-weight: bold; }
        .nav a.active { color: #fff; }
        .nav .plus { background: #ff0050; color: #fff; padding: 4px 16px; border-radius: 6px; font-weight: bold; }
        .no-video { text-align: center; color: #777; position: absolute; z-index: 10; }
    </style>
</head>
<body>
    <div class="feed" id="videoFeed"></div>

    <div class="nav">
        <a href="/" class="active">Home</a>
        <a href="/friends">Friends</a>
        <a href="/upload" class="plus">+</a>
        <a href="/inbox">Inbox</a>
        <a href="/profile">Profile</a>
    </div>

    <script>
        const defaultVideos = [
            {
                id: "def_1",
                caption: "FX Master Comedy #funny #trending",
                url: "https://www.w3schools.com/html/mov_bbb.mp4",
                username: "@fx_master",
                likes: 1240,
                comments: 85,
                reposts: 12,
                saved: 42
            }
        ];

        let localVideos = JSON.parse(localStorage.getItem('fx_videos') || '[]');
        // Ensure local videos have proper IDs and counts
        localVideos = localVideos.map((v, idx) => ({
            id: v.id || `local_${idx}`,
            caption: v.caption || "FX Master Video",
            url: v.url,
            username: v.username || "@fx_user",
            likes: v.likes || 10,
            comments: v.comments || 2,
            reposts: v.reposts || 1,
            saved: v.saved || 3
        }));

        let allVideos = [...localVideos, ...defaultVideos];
        const feedContainer = document.getElementById('videoFeed');

        if (allVideos.length === 0) {
            feedContainer.innerHTML = '<div class="no-video"><h2>No videos yet!</h2><p>Click "+" below to upload.</p></div>';
        } else {
            allVideos.forEach((video, index) => {
                let vId = video.id;
                let div = document.createElement('div');
                div.className = 'video-container';
                let isFirst = (index === 0);
                
                div.innerHTML = `
                    <video src="${video.url}" ${isFirst ? 'autoplay' : ''} loop playsinline preload="auto" onclick="togglePlay(this)"></video>
                    <div class="footer">
                        <h3>${video.username}</h3>
                        <p>${video.caption}</p>
                    </div>
                    <div class="sidebar">
                        <div class="profile-badge">
                            <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Profile">
                        </div>
                        <div class="sidebar-item" onclick="handleAction('${vId}', 'like')">
                            <div class="icon-btn" id="like-icon-${vId}">❤️</div>
                            <span id="like-count-${vId}">${video.likes}</span>
                        </div>
                        <div class="sidebar-item" onclick="handleAction('${vId}', 'comment')">
                            <div class="icon-btn">💬</div>
                            <span id="comment-count-${vId}">${video.comments}</span>
                        </div>
                        <div class="sidebar-item" onclick="handleAction('${vId}', 'repost')">
                            <div class="icon-btn">🔁</div>
                            <span id="repost-count-${vId}">${video.reposts}</span>
                        </div>
                        <div class="sidebar-item" onclick="handleAction('${vId}', 'save')">
                            <div class="icon-btn" id="save-icon-${vId}">⭐</div>
                            <span id="save-count-${vId}">${video.saved}</span>
                        </div>
                        <div class="sidebar-item" onclick="handleAction('${vId}', 'share')">
                            <div class="icon-btn">↗️</div>
                            <span>Share</span>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(div);
            });
        }

        function togglePlay(vid) {
            if (vid.paused) { vid.play(); } else { vid.pause(); }
        }

        function handleAction(id, type) {
            if (type === 'like') {
                let countSpan = document.getElementById(`like-count-${id}`);
                let icon = document.getElementById(`like-icon-${id}`);
                let val = parseInt(countSpan.innerText) || 0;
                if(icon.style.filter === 'grayscale(1)') {
                    countSpan.innerText = val + 1;
                    icon.style.filter = 'none';
                    icon.style.transform = 'scale(1.2)';
                    setTimeout(() => icon.style.transform = 'scale(1)', 200);
                } else {
                    countSpan.innerText = Math.max(0, val - 1);
                    icon.style.filter = 'grayscale(1)';
                }
            } 
            else if (type === 'comment') {
                let c = prompt("Write a comment:");
                if(c && c.trim() !== "") {
                    let span = document.getElementById(`comment-count-${id}`);
                    span.innerText = (parseInt(span.innerText) || 0) + 1;
                    alert("Comment posted successfully!");
                }
            } 
            else if (type === 'repost') {
                let span = document.getElementById(`repost-count-${id}`);
                span.innerText = (parseInt(span.innerText) || 0) + 1;
                alert("Video reposted to your profile!");
            } 
            else if (type === 'save') {
                let span = document.getElementById(`save-count-${id}`);
                let icon = document.getElementById(`save-icon-${id}`);
                let val = parseInt(span.innerText) || 0;
                span.innerText = val + 1;
                icon.style.color = '#ffaa00';
                alert("Saved to favorites!");
            } 
            else if (type === 'share') {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link copied to clipboard!");
                } else {
                    alert("Share link ready!");
                }
            }
        }

        const observerOptions = {
            root: document.getElementById('videoFeed'),
            threshold: 0.6
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (video) {
                    if (entry.isIntersecting) {
                        video.muted = false;
                        video.play().catch(e => console.log(e));
                    } else {
                        video.pause();
                        video.muted = true;
                    }
                }
            });
        }, observerOptions);

        document.querySelectorAll('.video-container').forEach(container => {
            observer.observe(container);
        });
    </script>
</body>
</html>
