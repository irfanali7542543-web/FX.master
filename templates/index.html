<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Live Market Signal & Analysis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .top-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.9);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }
        .top-nav span {
            font-size: 16px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }
        .top-nav span.active {
            color: #00f2fe;
            border-bottom: 2px solid #00f2fe;
            padding-bottom: 2px;
        }
        .content-container {
            margin-top: 60px;
            padding: 20px;
            height: calc(100vh - 120px);
            overflow-y: auto;
        }
        .group-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .admin-badge {
            background: #00f2fe;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .signal-box {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 4px solid #28a745;
        }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item .icon {
            display: block;
            margin: 0 auto 2px auto;
            font-size: 18px;
        }
        .plus-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            width: 36px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <span id="forexTab" onclick="switchTopTab('forex')">Forex</span>
        <span id="foryouTab" class="active" onclick="switchTopTab('foryou')">For You</span>
    </div>

    <!-- Main Dynamic Content Area -->
    <div class="content-container" id="mainContent">
        <!-- Default View: For You (Group & Signals) -->
        <div id="forYouView">
            <div style="text-align: center; color: #00f2fe; font-weight: bold; margin-bottom: 15px;">GROUP TOP (1 members)</div>
            
            <div class="group-card">
                <div class="group-header">
                    <span><strong>DIGI ANTI</strong></span>
                    <span class="admin-badge">admin</span>
                </div>
                <div style="font-size: 14px; color: #ddd;">سلام TOP خوش آمدی ❖ عزیز به گروه 🦋</div>
                <div style="font-size: 10px; color: #777; text-align: right; margin-top: 5px;">01:52 PM</div>
            </div>

            <div class="group-card">
                <div style="font-weight: bold; margin-bottom: 5px;">#XAUUSD VIP SIGNAL BUY 4290</div>
                <div class="signal-box">
                    <div>Limit 4285</div>
                    <div style="color: #28a745;">✅ TP 4295</div>
                    <div style="color: #28a745;">✅ TP 4300</div>
                    <div style="color: #ff4d4d;">vs S.L. 4277</div>
                </div>
                <div style="font-size: 10px; color: #777; text-align: right; margin-top: 5px;">08:40 AM</div>
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button style="background: #28a745; color: white; border: none; padding: 10px 40px; border-radius: 20px; font-weight: bold; font-size: 16px; width: 100%;">JOIN</button>
            </div>
        </div>
    </div>

    <!-- Bottom TikTok Style Navigation Bar -->
    <div class="bottom-bar" id="bottomBar">
        <div class="nav-item" onclick="loadHome()">
            <span class="icon">🏠</span>
            Home
        </div>
        <div class="nav-item active" onclick="loadGroup()">
            <span class="icon">👥</span>
            Official Group
        </div>
        <div class="nav-item">
            <div class="plus-btn">+</div>
        </div>
        <div class="nav-item" onclick="loadInbox()">
            <span class="icon">📥</span>
            Inbox
        </div>
        <div class="nav-item" onclick="loadProfile()">
            <span class="icon">👤</span>
            Profile
        </div>
    </div>

    <script>
        function switchTopTab(tab) {
            const forexTab = document.getElementById('forexTab');
            const foryouTab = document.getElementById('foryouTab');
            const container = document.getElementById('mainContent');
            const bottomBar = document.getElementById('bottomBar');

            if (tab === 'forex') {
                forexTab.classList.add('active');
                foryouTab.classList.remove('active');
                // Forex page - Bilkul khali aur neeche wale buttons gayab
                container.innerHTML = '';
                bottomBar.style.display = 'none';
            } else {
                foryouTab.classList.add('active');
                forexTab.classList.remove('active');
                // For You page - Original content aur neeche wale buttons wapas
                bottomBar.style.display = 'flex';
                container.innerHTML = `
                    <div style="text-align: center; color: #00f2fe; font-weight: bold; margin-bottom: 15px;">GROUP TOP (1 members)</div>
                    <div class="group-card">
                        <div class="group-header">
                            <span><strong>DIGI ANTI</strong></span>
                            <span class="admin-badge">admin</span>
                        </div>
                        <div style="font-size: 14px; color: #ddd;">سلام TOP خوش آمدی ❖ عزیز به گروه 🦋</div>
                        <div style="font-size: 10px; color: #777; text-align: right; margin-top: 5px;">01:52 PM</div>
                    </div>
                    <div class="group-card">
                        <div style="font-weight: bold; margin-bottom: 5px;">#XAUUSD VIP SIGNAL BUY 4290</div>
                        <div class="signal-box">
                            <div>Limit 4285</div>
                            <div style="color: #28a745;">✅ TP 4295</div>
                            <div style="color: #28a745;">✅ TP 4300</div>
                            <div style="color: #ff4d4d;">vs S.L. 4277</div>
                        </div>
                        <div style="font-size: 10px; color: #777; text-align: right; margin-top: 5px;">08:40 AM</div>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button style="background: #28a745; color: white; border: none; padding: 10px 40px; border-radius: 20px; font-weight: bold; font-size: 16px; width: 100%;">JOIN</button>
                    </div>
                `;
            }
        }

        function loadGroup() {
            switchTopTab('foryou');
        }

        function loadHome() {
            document.getElementById('mainContent').innerHTML = `
                <div style="text-align: center; padding-top: 40px;">
                    <h2>FX Master Market Hub</h2>
                    <p style="color: #888;">Live Forex Analysis & Professional Insights</p>
                </div>
            `;
        }

        function loadInbox() {
            document.getElementById('mainContent').innerHTML = `
                <div style="padding: 20px;">
                    <h3>Inbox / Notifications</h3>
                    <p style="color: #888;">No new messages.</p>
                </div>
            `;
        }

        function loadProfile() {
            document.getElementById('mainContent').innerHTML = `
                <div style="padding: 20px; text-align: center;">
                    <h3>@fx_master</h3>
                    <p style="color: #888;">Live Market Signal & Analysis Creator</p>
                </div>
            `;
        }
    </script>
</body>
</html>
