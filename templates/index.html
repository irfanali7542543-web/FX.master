<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FX Master - Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body, html{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;overflow:hidden;}

.video-container{position:relative;width:100%;height:100vh;background:#000;display:flex;align-items:center;justify-content:center;}
.media-element{width:100%;height:100%;object-fit:cover;}

.top-header{position:absolute;top:15px;left:0;width:100%;display:flex;justify-content:center;align-items:center;padding:0 16px;z-index:100;}
.tabs{display:flex;gap:25px;font-size:16px;font-weight:700;}
.tab{color:rgba(255,255,255,0.6);cursor:pointer;padding-bottom:3px;}
.tab.active{color:#fff;border-bottom:3px solid #fff;}

.right-actions{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:100;}
.action-item{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;}
.action-item i{font-size:28px;margin-bottom:3px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}
.profile-avatar{width:45px;height:45px;border-radius:50%;border:2px solid #fff;background:#fff;margin-bottom:10px;background-size:cover;background-position:center;}

.bottom-details{position:absolute;bottom:80px;left:15px;z-index:100;max-width:75%;}
.user-name{font-size:16px;font-weight:bold;margin-bottom:6px;display:flex;align-items:center;gap:6px;}

.disc-icon{position:absolute;right:15px;bottom:30px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#333 30%,#111 70%);border:2px solid #222;display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite;z-index:100;}
.disc-icon::after{content:'';width:10px;height:10px;background:#f1c40f;border-radius:50%;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:999;}
.nav-item{color:#8e8e8e;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:11px;}
.nav-item i{font-size:20px;margin-bottom:3px;}
.nav-item.active{color:#fff;}
.post-btn{background:linear-gradient(45deg,#00f2fe,#4facfe);color:#000;width:42px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;}
</style>
</head>
<body>

<div class="video-container" id="feedContainer">
  <div class="top-header">
    <div class="tabs">
      <span class="tab active">For You</span>
      <span class="tab">Forex</span>
    </div>
  </div>

  <!-- Media feed player -->
  <div id="mediaBox" style="width:100%;height:100%;">
    <video class="media-element" autoplay loop muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
  </div>

  <div class="right-actions">
    <div class="profile-avatar" style="background-image:url('https://picsum.photos/100');"></div>
    <div class="action-item"><i class="fas fa-heart" style="color:#fe2c55;"></i><span>2,450</span></div>
    <div class="action-item"><i class="fas fa-comment-dots"></i><span>128</span></div>
    <div class="action-item"><i class="fas fa-bookmark"></i><span>310</span></div>
    <div class="action-item"><i class="fas fa-share"></i><span>45</span></div>
  </div>

  <div class="bottom-details">
    <div class="user-name">🔥 ꧁Tayyab Jutt꧂ 🔥</div>
  </div>

  <div class="disc-icon"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const userPosts = JSON.parse(localStorage.getItem('user_posts') || '[]');
  if (userPosts.length > 0) {
    const latest = userPosts[0];
    const mediaBox = document.getElementById('mediaBox');
    if (latest.type === 'video') {
      mediaBox.innerHTML = `<video class="media-element" autoplay loop muted playsinline src="${latest.url}"></video>`;
    } else {
      mediaBox.innerHTML = `<img class="media-element" src="${latest.url}" alt="Post">`;
    }
  }
});
</script>

<div class="bottom-nav">
  <a href="/" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/group" class="nav-item"><i class="fas fa-users"></i><span>Group</span></a>
  <a href="/post" class="nav-item post-btn"><i class="fas fa-plus"></i></a>
  <a href="/inbox" class="nav-item"><i class="fas fa-comment-dots"></i><span>Inbox</span></a>
  <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</div>

</body>
</html>
