<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Home</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .top-bar { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; z-index: 100; }
        .search-icon { color: #aaa; font-size: 18px; text-decoration: none; }
        .top-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 16px; margin: 0 auto; position: absolute; left: 50%; transform: translateX(-50%); }
        .top-tab { color: #777; text-decoration: none; cursor: pointer; padding-bottom: 3px; }
        .top-tab.active { color: #fff; border-bottom: 2px solid #fff; }
        .feed { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 60px); text-align: center; color: #777; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; border-top: 1px solid #1a1a1a; padding: 10px 0; z-index: 1000; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .bottom-nav a.active { color: #fff; font-weight: bold; }
        .plus-btn { background: linear-gradient(135deg, #00f2fe 0%, #ff0050 100%); color: #fff; width: 42px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-tabs">
            <a href="/forex" class="top-tab">Forex</a>
            <a href="/" class="top-tab active">For You</a>
        </div>
        <a href="#" class="search-icon">🔍</a>
    </div>

    <div class="feed">
        <h2>Welcome to FX Master</h2>
        <p>Swipe up for more videos</p>
    </div>

    <div class="bottom-nav">
        <a href="/" class="active">🏠 Home</a>
        <a href="/group">👥 Official Group</a>
        <a href="/upload"><div class="plus-btn">+</div></a>
        <a href="/inbox">📥 Inbox</a>
        <a href="/profile">👤 Profile</a>
    </div>
</body>
</html>
