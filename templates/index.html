<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Live Market Signal & Analysis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .top-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.95);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid #ddd;
        }
        .top-nav span {
            font-size: 16px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }
        .top-nav span.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 2px;
        }
        .content-container {
            margin-top: 60px;
            padding: 20px;
            padding-bottom: 80px;
            overflow-y: auto;
        }
        
        /* Forex Tab ke neche wale buttons */
        .forex-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #ddd;
            z-index: 100;
        }
        .forex-nav-item {
            text-align: center;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
        }
        .forex-nav-item.active {
            color: #007bff;
            font-weight: bold;
        }
        .forex-nav-item .icon {
            display: block;
            margin: 0 auto 2px auto;
            font-size: 18px;
        }
        .forex-plus-btn {
            background: linear-gradient(45deg, #007bff, #00f2fe);
            width: 36px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
        }

        .group-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .admin-badge {
            background: #007bff;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .signal-box {
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #e0e0e0;
            border-left: 4px solid #28a745;
        }

        /* For You tab wala bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #ddd;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active {
            color: #000;
            font-weight: bold;
        }
        .nav-item .icon {
            display: block;
            margin: 0 auto 2px auto;
            font-size: 18px;
        }
        .plus-btn {
            background: linear-gradient(45deg, #007bff, #00f2fe);
            width: 36px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <span id="forexTab" class="active" onclick="switchTopTab('forex')">Forex</span>
        <span id="foryouTab" onclick="switchTopTab('foryou')">For You</span>
    </div>

    <!-- Main Dynamic Content Area -->
    <div class="content-container" id="mainContent">
        <div id="forexSubContent"></div>
    </div>

    <!-- Dynamic Bottom Bars Container -->
    <div id="bottomBarContainer">
        <!-- Forex ke neche wale buttons: 1. Home (HEME), 2. Meta 5, 3. Plus (+), 4. Profile, 5. Channel -->
        <div class="forex-bottom-bar" id="forexBottomBar">
            <button class="forex-nav-item active" onclick="switchForexSub('home', this)">
                <span class="icon">🏠</span>
                HEME
            </button>
            <button class="forex-nav-item" onclick="switchForexSub('meta5', this)">
                <span class="icon">📊</span>
                HEME
            </button>
            <button class="forex-nav-item" onclick="switchForexSub('plus', this)">
                <div class="forex-plus-btn">+</div>
            </button>
            <button class="forex-nav-item" onclick="switchForexSub('profile', this)">
                <span class="icon">👤</span>
                HEME
            </button>
            <button class="forex-nav-item" onclick="switchForexSub('channel', this)">
                <span class="icon">📢</span>
                HEME
            </button>
        </div>
    </div>

    <script>
        function switchTopTab(tab) {
            const forexTab = document.getElementById('forexTab');
            const foryouTab = document.getElementById('foryouTab');
            const container = document.getElementById('mainContent');
            const bottomBarContainer = document.getElementById('bottomBarContainer');

            if (tab === 'forex') {
                forexTab.classList.add('active');
                foryouTab.classList.remove('active');
                
                bottomBarContainer.innerHTML = `
                    <div class="forex-bottom-bar" id="forexBottomBar">
                        <button class="forex-nav-item active" onclick="switchForexSub('home', this)">
                            <span class="icon">🏠</span>
                            HEME
                        </button>
                        <button class="forex-nav-item" onclick="switchForexSub('meta5', this)">
                            <span class="icon">📊</span>
                            HEME
                        </button>
                        <button class="forex-nav-item" onclick="switchForexSub('plus', this)">
                            <div class="forex-plus-btn">+</div>
                        </button>
                        <button class="forex-nav-item" onclick="switchForexSub('profile', this)">
                            <span class="icon">👤</span>
                            HEME
                        </button>
                        <button class="forex-nav-item" onclick="switchForexSub('channel', this)">
                            <span class="icon">📢</span>
                            HEME
                        </button>
                    </div>
                `;

                container.innerHTML = `<div id="forexSubContent"></div>`;
            } else {
                foryouTab.classList.add('active');
                forexTab.classList.remove('active');
                
                bottomBarContainer.innerHTML = `
                    <div class="bottom-bar" id="bottomBar">
                        <div class="nav-item" onclick="loadHome()">
                            <span class="icon">🏠</span>
                            Home
                        </div>
                        <div class="nav-item active" onclick="loadGroup()">
                            <span class="icon">👥</span>
                            Official Group
                        </div>
                        <div class="nav-item">
                            <div class="plus-btn">+</div>
                        </div>
                        <div class="nav-item" onclick="loadInbox()">
                            <span class="icon">📥</span>
                            Inbox
                        </div>
                        <div class="nav-item" onclick="loadProfileMain()">
                            <span class="icon">👤</span>
                            Profile
                        </div>
                    </div>
                `;

                container.innerHTML = `
                    <div id="forYouView">
                        <div style="text-align: center; color: #007bff; font-weight: bold; margin-bottom: 15px;">GROUP TOP (1 members)</div>
                        <div class="group-card">
                            <div class="group-header">
                                <span><strong>DIGI ANTI</strong></span>
                                <span class="admin-badge">admin</span>
                            </div>
                            <div style="font-size: 14px; color: #333;">سلام TOP خوش آمدی ❖ عزیز به گروه 🦋</div>
                            <div style="font-size: 10px; color: #777; text-align: right; margin-top: 5px;">01:52 PM</div>
                        </div>
                        <div class="group-card">
                            <div style="font-weight: bold; margin-bottom: 5px; color: #000;">#XAUUSD VIP SIGNAL BUY 4290</div>
                            <div class="signal-box">
                                <div style="color: #333;">Limit 4285</div>
                                <div style="color: #28a745; font-weight: bold;">✅ TP 4295</div>
                                <div style="color: #28a745; font-weight: bold;">✅ TP 4300</div>
                                <div style="color: #dc3545; font-weight: bold;">vs S.L. 4277</div>
                            </div>
                            <div style="font-size: 10px; color: #777; text-align: right; margin-top: 5px;">08:40 AM</div>
                        </div>
                        <div style="text-align: center; margin-top: 20px;">
                            <button style="background: #28a745; color: white; border: none; padding: 10px 40px; border-radius: 20px; font-weight: bold; font-size: 16px; width: 100%;">JOIN</button>
                        </div>
                    </div>
                `;
            }
        }

        function switchForexSub(section, btnElement) {
            const buttons = document.querySelectorAll('.forex-nav-item');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const subContainer = document.getElementById('forexSubContent');
            subContainer.innerHTML = '';
        }

        function loadGroup() {
            switchTopTab('foryou');
        }

        function loadHome() {
            document.getElementById('mainContent').innerHTML = `
                <div style="text-align: center; padding-top: 40px; color: #000;">
                    <h2>FX Master Market Hub</h2>
                    <p style="color: #666;">Live Forex Analysis & Professional Insights</p>
                </div>
            `;
        }

        function loadInbox() {
            document.getElementById('mainContent').innerHTML = `
                <div style="padding: 20px; color: #000;">
                    <h3>Inbox / Notifications</h3>
                    <p style="color: #666;">No new messages.</p>
                </div>
            `;
        }

        function loadProfileMain() {
            document.getElementById('mainContent').innerHTML = `
                <div style="padding: 20px; text-align: center; color: #000;">
                    <h3>@fx_master</h3>
                    <p style="color: #666;">Live Market Signal & Analysis Creator</p>
                </div>
            `;
        }
    </script>
</body>
</html>
