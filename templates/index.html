<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        .video-container { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #000; }
        
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .footer { position: absolute; bottom: 70px; left: 15px; z-index: 10; max-width: 75%; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .footer h3 { margin: 0 0 5px 0; font-size: 16px; }
        .footer p { margin: 0; font-size: 14px; word-break: break-word; }
        
        .sidebar { position: absolute; right: 15px; bottom: 90px; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }
        .sidebar-item { text-align: center; cursor: pointer; color: #fff; font-size: 12px; }
        .icon-btn { width: 45px; height: 45px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; margin-bottom: 3px; border: 1px solid rgba(255,255,255,0.2); }
        .profile-badge { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #333; margin-bottom: 5px; }
        .profile-badge img { width: 100%; height: 100%; object-fit: cover; }

        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; padding: 12px 0; border-top: 1px solid #222; z-index: 100; }
        .nav a { color: #888; text-decoration: none; font-size: 14px; font-weight: bold; }
        .nav a.active { color: #fff; }
        .nav .plus { background: #ff0050; color: #fff; padding: 4px 16px; border-radius: 6px; font-weight: bold; }
        .no-video { text-align: center; color: #777; position: absolute; z-index: 10; }
    </style>
</head>
<body>
    <div class="feed" id="videoFeed"></div>

    <div class="nav">
        <a href="/" class="active">Home</a>
        <a href="/friends">Friends</a>
        <a href="/upload" class="plus">+</a>
        <a href="/inbox">Inbox</a>
        <a href="/profile">Profile</a>
    </div>

    <script>
        const defaultVideos = [
            {
                id: 1,
                caption: "FX Master Comedy #funny #trending",
                url: "https://www.w3schools.com/html/mov_bbb.mp4",
                username: "@fx_master",
                likes: 1240,
                comments: 85,
                saved: 42
            }
        ];

        let localVideos = JSON.parse(localStorage.getItem('fx_videos') || '[]');
        let allVideos = [...localVideos, ...defaultVideos];
        const feedContainer = document.getElementById('videoFeed');

        if (allVideos.length === 0) {
            feedContainer.innerHTML = '<div class="no-video"><h2>No videos yet!</h2><p>Click "+" below to upload.</p></div>';
        } else {
            allVideos.forEach((video, index) => {
                let div = document.createElement('div');
                div.className = 'video-container';
                // First video plays with sound by default, others muted until scrolled
                let isFirst = (index === 0);
                div.innerHTML = `
                    <video src="${video.url}" ${isFirst ? 'autoplay' : ''} loop playsinline preload="auto" onclick="togglePlay(this)"></video>
                    <div class="footer">
                        <h3>${video.username || '@fx_user'}</h3>
                        <p>${video.caption || 'FX Master Video'}</p>
                    </div>
                    <div class="sidebar">
                        <div class="profile-badge">
                            <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Profile">
                        </div>
                        <div class="sidebar-item" onclick="likeVideo(this)">
                            <div class="icon-btn">❤️</div>
                            <span>${video.likes || 12}</span>
                        </div>
                        <div class="sidebar-item" onclick="alert('Comments section')">
                            <div class="icon-btn">💬</div>
                            <span>${video.comments || 4}</span>
                        </div>
                        <div class="sidebar-item" onclick="alert('Saved to favorites!')">
                            <div class="icon-btn">⭐</div>
                            <span>${video.saved || 2}</span>
                        </div>
                        <div class="sidebar-item" onclick="alert('Video link copied!')">
                            <div class="icon-btn">↗️</div>
                            <span>Share</span>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(div);
            });
        }

        function togglePlay(vid) {
            if (vid.paused) { vid.play(); } else { vid.pause(); }
        }

        function likeVideo(element) {
            let span = element.nextElementSibling;
            span.innerText = parseInt(span.innerText) + 1;
        }

        // Intersection Observer to handle automatic play/pause and sound per video on scroll
        const observerOptions = {
            root: document.getElementById('videoFeed'),
            threshold: 0.6
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (video) {
                    if (entry.isIntersecting) {
                        video.muted = false; // Unmute current visible video automatically
                        video.play().catch(e => console.log(e));
                    } else {
                        video.pause();
                        video.muted = true; // Mute hidden video
                    }
                }
            });
        }, observerOptions);

        document.querySelectorAll('.video-container').forEach(container => {
            observer.observe(container);
        });
    </script>
</body>
</html>
