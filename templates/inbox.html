<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inbox</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body, html{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}

/* Top Header with 3 Buttons */
.inbox-header{position:fixed;top:0;left:0;width:100%;height:65px;background:#000;display:flex;justify-content:center;align-items:center;gap:12px;z-index:1000;border-bottom:1px solid #1a1a1a;}
.filter-btn{background:#1f1f1f;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.filter-btn.active{background:#fff;color:#000;}

/* Inbox Content Area */
.inbox-body{flex:1;padding:75px 16px 80px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;}
.notification-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.notif-left{display:flex;align-items:center;gap:12px;}
.notif-avatar{width:45px;height:45px;border-radius:50%;background:#333;background-size:cover;background-position:center;}
.notif-title{font-size:14px;font-weight:bold;color:#fff;margin-bottom:2px;}
.notif-desc{font-size:12px;color:#aaa;}
.notif-time{font-size:11px;color:#777;}

/* Bottom Navigation Bar */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:999;}
.nav-item{color:#8e8e8e;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:11px;}
.nav-item i{font-size:20px;margin-bottom:3px;}
.nav-item.active{color:#fff;}
.post-btn{background:linear-gradient(45deg,#00f2fe,#4facfe);color:#000;width:42px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;}
</style>
</head>
<body>

<!-- Top Header with 3 Buttons -->
<div class="inbox-header">
  <button class="filter-btn active">Likes</button>
  <button class="filter-btn">Followers</button>
  <button class="filter-btn">Replies</button>
</div>

<!-- Inbox Notifications List -->
<div class="inbox-body">
  <div class="notification-item">
    <div class="notif-left">
      <div class="notif-avatar" style="background-image:url('https://picsum.photos/101');"></div>
      <div>
        <div class="notif-title">Tayyab Jutt</div>
        <div class="notif-desc">Liked your video.</div>
        <div class="notif-time">2h ago</div>
      </div>
    </div>
  </div>

  <div class="notification-item">
    <div class="notif-left">
      <div class="notif-avatar" style="background-image:url('https://picsum.photos/102');"></div>
      <div>
        <div class="notif-title">Ali Khan</div>
        <div class="notif-desc">Started following you.</div>
        <div class="notif-time">5h ago</div>
      </div>
    </div>
  </div>

  <div class="notification-item">
    <div class="notif-left">
      <div class="notif-avatar" style="background-image:url('https://picsum.photos/103');"></div>
      <div>
        <div class="notif-title">Lavaro Crus</div>
        <div class="notif-desc">Replied: "Zabardast!"</div>
        <div class="notif-time">1d ago</div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
  <a href="/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/group" class="nav-item"><i class="fas fa-users"></i><span>Group</span></a>
  <a href="/post" class="nav-item post-btn"><i class="fas fa-plus"></i></a>
  <a href="/inbox" class="nav-item active"><i class="fas fa-comment-dots"></i><span>Inbox</span></a>
  <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</div>

</body>
</html>
