<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Profile - FX Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #517da2; /* Telegram Profile Blue Background */
        }
        .profile-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            justify-content: space-between;
        }
        /* Header with Back and Dark Mode Icon */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            color: white;
        }
        .back-btn, .dark-mode-btn {
            font-size: 22px;
            cursor: pointer;
        }
        /* Center Profile Content */
        .profile-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin-top: -20px;
        }
        .profile-pic-circle {
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 4px solid rgba(255,255,255,0.3);
            margin-bottom: 20px;
        }
        .channel-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .channel-members {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
        }
        /* Bottom Boost / Join Section */
        .boost-section {
            background: rgba(0, 0, 0, 0.15);
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(5px);
            margin-bottom: 60px; /* Space for bottom navbar */
        }
        .boost-section a {
            color: #a4d0f5;
            text-decoration: none;
            font-weight: bold;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 11px;
        }
        .nav-item.active {
            color: #007aff;
        }
        .nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Header -->
        <div class="profile-header">
            <div class="back-btn">←</div>
            <div class="dark-mode-btn">🌙</div>
        </div>

        <!-- Main Profile Info -->
        <div class="profile-content">
            <div class="profile-pic-circle">
                <svg width="60" height="40" viewBox="0 0 60 40">
                    <polyline fill="none" stroke="#2196F3" stroke-width="3" points="5,30 20,20 35,25 50,10" />
                </svg>
            </div>
            <div class="channel-title">FX_MASTER</div>
            <div class="channel-members">35 members</div>
        </div>

        <!-- Bottom Boost info / Join action -->
        <div class="boost-section">
            The group has 0 boosts. <a href="#" onclick="alert('Channel Joined Successfully!')">What are boosts?</a>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="/" class="nav-item">
                <span>🏠</span>
                Home
            </a>
            <a href="/market" class="nav-item">
                <span>📊</span>
                Market
            </a>
            <a href="#" class="nav-item" style="position: relative; top: -10px;">
                <div style="width: 45px; height: 45px; background: #00b0ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">+</div>
            </a>
            <a href="#" class="nav-item">
                <span>👤</span>
                Profile
            </a>
            <a href="/channel" class="nav-item active">
                <span>📢</span>
                Channel
            </a>
        </div>
    </div>

</body>
</html>
