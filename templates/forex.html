<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex - FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .top-tabs { position: absolute; top: 15px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 100; font-weight: bold; font-size: 16px; }
        .top-tab { color: #777; text-decoration: none; cursor: pointer; padding-bottom: 3px; }
        .top-tab.active { color: #fff; border-bottom: 2px solid #fff; }
        .feed { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 60px); text-align: center; color: #00f2fe; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; border-top: 1px solid #1a1a1a; padding: 10px 0; z-index: 1000; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .bottom-nav a.active { color: #fff; font-weight: bold; }
        .plus-btn { background: linear-gradient(135deg, #00f2fe 0%, #ff0050 100%); color: #fff; width: 42px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-tabs">
        <a href="/" class="top-tab">For You</a>
        <a href="/forex" class="top-tab active">Forex</a>
    </div>

    <div class="feed">
        <h2>Forex Trading Signals & Insights</h2>
        <p style="color: #888;">Exclusive currency market updates here</p>
    </div>

    <div class="bottom-nav">
        <a href="/" class="active">🏠 Home</a>
        <a href="/group">👥 Official Group</a>
        <a href="/upload"><div class="plus-btn">+</div></a>
        <a href="/inbox">📥 Inbox</a>
        <a href="/profile">👤 Profile</a>
    </div>
</body>
</html>
