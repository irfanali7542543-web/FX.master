<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - FX Master</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; font-size: 16px; border-bottom: 1px solid #111; }
        .profile-info { display: flex; flex-direction: column; align-items: center; padding: 15px; text-align: center; }
        .avatar-box { position: relative; width: 85px; height: 85px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: 35px; border: 2px solid #333; margin-bottom: 10px; }
        .plus-badge { position: absolute; bottom: 0; right: 0; background: #00f2fe; color: #000; width: 22px; height: 22px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #000; }
        .username { font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .stats { display: flex; gap: 30px; margin-bottom: 15px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 16px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #888; }
        .bio-btn-box { display: flex; gap: 10px; width: 100%; max-width: 320px; margin-bottom: 15px; }
        .btn-action { flex: 1; background: #222; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; font-weight: bold; text-align: center; text-decoration: none; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; border-top: 1px solid #1a1a1a; padding: 10px 0; z-index: 1000; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .bottom-nav a.active { color: #fff; font-weight: bold; }
        .plus-btn { background: linear-gradient(135deg, #00f2fe 0%, #ff0050 100%); color: #fff; width: 42px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="profile-header">
        <span>⚙️</span>
        <span>forex.trader7895</span>
        <span>📊 ≡</span>
    </div>

    <div class="profile-info">
        <div class="avatar-box">
            📈
            <div class="plus-badge">+</div>
        </div>
        <div class="username">@forex.trader7895</div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-num">213</div>
                <div class="stat-label">Following</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">123</div>
                <div class="stat-label">Followers</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">1,032</div>
                <div class="stat-label">Likes</div>
            </div>
        </div>

        <div class="bio-btn-box">
            <a href="#" class="btn-action">+ Add bio</a>
            <a href="#" class="btn-action">Get in touch with me...</a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/">🏠 Home</a>
        <a href="/group">👥 Official Group</a>
        <a href="/upload"><div class="plus-btn">+</div></a>
        <a href="/inbox">📥 Inbox</a>
        <a href="/profile" class="active">👤 Profile</a>
    </div>
</body>
</html>
