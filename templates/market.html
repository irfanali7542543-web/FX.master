<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Market View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .market-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        /* MT5 Top Action Bar (Sell / Lot / Buy) */
        .mt5-top-bar {
            display: flex;
            align-items: center;
            background: #f4f5f7;
            padding: 6px 8px;
            border-bottom: 1px solid #ddd;
        }
        .tool-btn {
            font-size: 16px;
            padding: 4px 8px;
            cursor: pointer;
            background: #e4e6eb;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: bold;
            color: #333;
        }
        .price-box-sell {
            background-color: #2196F3;
            color: white;
            flex: 1;
            padding: 4px;
            text-align: center;
            border-radius: 4px;
            margin-right: 4px;
        }
        .lot-display {
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .price-box-buy {
            background-color: #007aff;
            color: white;
            flex: 1;
            padding: 4px;
            text-align: center;
            border-radius: 4px;
            margin-left: 4px;
        }
        /* Full Screen Chart Area */
        .chart-area {
            flex: 1;
            width: 100%;
            position: relative;
            background: #ffffff;
            padding-bottom: 55px; /* Space for bottom MT5 tabs */
        }
        .chart-area iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* MT5 Bottom Navigation Bar (Quotes, Charts, Trade/History, Messages) */
        .mt5-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .mt5-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 11px;
        }
        .mt5-nav-item.active {
            color: #007aff;
        }
        .mt5-nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="market-layout">
        <!-- Top MT5 Price & Toolbar -->
        <div class="mt5-top-bar">
            <span class="tool-btn">☰</span>
            <div class="price-box-sell">
                <div style="font-size: 9px; opacity: 0.9;">SELL</div>
                <div style="font-size: 13px; font-weight: bold;">4318.77</div>
            </div>
            <div class="lot-display">
                <span>⌄</span> 0.01 <span>^</span>
            </div>
            <div class="price-box-buy">
                <div style="font-size: 9px; opacity: 0.9;">BUY</div>
                <div style="font-size: 13px; font-weight: bold;">4319.07</div>
            </div>
            <span class="tool-btn" style="margin-left: 6px; margin-right: 0;">H1</span>
        </div>

        <!-- Full Screen Real-time TradingView Chart -->
        <div class="chart-area">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX%3AXAUUSD&interval=60&hidetoptoolbar=0&symboledit=0&saveimage=0&toolbarbg=f1f3f6&studies=[]&theme=light&style=1&timezone=Etc%2FUTC"></iframe>
        </div>

        <!-- MT5 Bottom Navigation (Quotes, Charts, History, Messages) -->
        <div class="mt5-bottom-nav">
            <a href="/market" class="mt5-nav-item">
                <span>⇄</span>
                Quotes
            </a>
            <a href="/market" class="mt5-nav-item active">
                <span>📊</span>
                Charts
            </a>
            <a href="/market" class="mt5-nav-item">
                <span>📈</span>
                Trade
            </a>
            <a href="/market" class="mt5-nav-item">
                <span>🕒</span>
                History
            </a>
            <a href="/channel" class="mt5-nav-item">
                <span>💬</span>
                Messages
            </a>
        </div>
    </div>

</body>
</html>
