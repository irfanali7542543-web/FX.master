<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market - MT5 Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .market-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        /* Top Tabs (Forex / For You) */
        .top-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 15px;
            font-weight: bold;
        }
        .top-tabs span {
            margin: 0 15px;
            color: #777;
            cursor: pointer;
        }
        .top-tabs span.active {
            color: #007aff;
            border-bottom: 2px solid #007aff;
            padding-bottom: 2px;
        }
        /* MT5 Top Action Toolbar (Icons: Menu, Plus, Indicator, Timeframe, Cross, Settings) */
        .mt5-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f5f7;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }
        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .tool-icon {
            font-size: 16px;
            color: #333;
            cursor: pointer;
            background: #e4e6eb;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .timeframe-badge {
            background: #e4e6eb;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }
        /* Sell / Buy Bar */
        .price-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 6px 10px;
            border-bottom: 1px solid #ddd;
        }
        .btn-price {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        .btn-sell {
            background-color: #2196F3;
            margin-right: 5px;
        }
        .btn-buy {
            background-color: #007aff;
            margin-left: 5px;
        }
        .lot-size {
            background: #f1f3f5;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        /* Fullscreen Live Chart */
        .chart-fullscreen {
            flex: 1;
            width: 100%;
            position: relative;
            background: #ffffff;
            padding-bottom: 60px;
        }
        .chart-fullscreen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="market-container">
        <!-- Top Switcher -->
        <div class="top-tabs">
            <span class="active">Forex</span>
            <span>For You</span>
        </div>

        <!-- MT5 Original Style Toolbar -->
        <div class="mt5-toolbar">
            <div class="toolbar-left">
                <span class="tool-icon">☰</span>
            </div>
            <div class="toolbar-right">
                <span class="tool-icon">+</span>
                <span class="tool-icon">📈</span>
                <span class="timeframe-badge">H4</span>
                <span class="tool-icon">⏱</span>
                <span class="tool-icon">◻</span>
            </div>
        </div>

        <!-- Price Bar -->
        <div class="price-action-bar">
            <div class="btn-price btn-sell">
                <div style="font-size: 10px; opacity: 0.9;">SELL</div>
                <div style="font-size: 14px;" id="sell-price">2636.25</div>
            </div>
            <div class="lot-size">▼ 0.1 ▲</div>
            <div class="btn-price btn-buy">
                <div style="font-size: 10px; opacity: 0.9;">BUY</div>
                <div style="font-size: 14px;" id="buy-price">2637.25</div>
            </div>
        </div>

        <!-- Live TradingView Chart -->
        <div class="chart-fullscreen">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX%3AXAUUSD&interval=240&hidetoptoolbar=1&symboledit=0&saveimage=0&toolbarbg=f1f3f6&studies=[]&theme=light&style=1&timezone=Etc%2FUTC"></iframe>
        </div>
    </div>

</body>
</html>
