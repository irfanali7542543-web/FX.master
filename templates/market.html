<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market - FX Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .market-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        /* Top Navigation Header (Forex / For You) */
        .top-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 16px;
            font-weight: bold;
        }
        .top-tabs span {
            margin: 0 15px;
            color: #888;
            cursor: pointer;
        }
        .top-tabs span.active {
            color: #007aff;
            border-bottom: 2px solid #007aff;
            padding-bottom: 2px;
        }
        /* Buy / Sell Price Bar */
        .price-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
        }
        .btn-price {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        .btn-sell {
            background-color: #2196F3;
            margin-right: 5px;
        }
        .btn-buy {
            background-color: #007aff;
            margin-left: 5px;
        }
        .lot-size {
            background: #e4e6eb;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: #333;
        }
        /* Full Screen Chart Area */
        .chart-fullscreen {
            flex: 1;
            width: 100%;
            position: relative;
            background: #ffffff;
            padding-bottom: 60px; /* Space for bottom navbar */
        }
        .chart-fullscreen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="market-container">
        <!-- Top Switcher -->
        <div class="top-tabs">
            <span class="active">Forex</span>
            <span>For You</span>
        </div>

        <!-- Price Bar -->
        <div class="price-action-bar">
            <div class="btn-price btn-sell">
                <div style="font-size: 11px; opacity: 0.9;">SELL</div>
                <div style="font-size: 15px;" id="sell-price">2677.54</div>
            </div>
            <div class="lot-size">0.1</div>
            <div class="btn-price btn-buy">
                <div style="font-size: 11px; opacity: 0.9;">BUY</div>
                <div style="font-size: 15px;" id="buy-price">2678.54</div>
            </div>
        </div>

        <!-- Fullscreen Live TradingView Chart -->
        <div class="chart-fullscreen">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX%3AXAUUSD&interval=H1&hidetoptoolbar=0&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=light&style=1&timezone=Etc%2FUTC"></iframe>
        </div>
    </div>

</body>
</html>
