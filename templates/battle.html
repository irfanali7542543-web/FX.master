<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        .reel-container { position: relative; width: 100vw; height: calc(100vh - 60px); display: flex; justify-content: center; align-items: center; background: #111; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Right Sidebar Actions */
        .sidebar { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { background: none; border: none; color: #fff; text-align: center; cursor: pointer; font-size: 12px; }
        .icon { width: 40px; height: 40px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; margin-bottom: 4px; transition: transform 0.2s; }
        .action-btn:active .icon { transform: scale(1.2); }
        .liked { color: #fe2c55 !important; }
        .liked .icon { background: rgba(254,44,85,0.2); }

        /* Profile icon with plus */
        .profile-icon { position: relative; }
        .profile-icon .add-badge { position: absolute; bottom: -2px; right: 50%; background: #fe2c55; width: 18px; height: 18px; border-radius: 50%; font-size: 14px; display: flex; justify-content: center; align-items: center; font-weight: bold; transform: translateX(50%); }

        /* Bottom Info Overlay */
        .overlay { position: absolute; bottom: 20px; left: 15px; right: 80px; z-index: 10; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none; }
        .overlay h3 { font-size: 16px; margin-bottom: 6px; }
        .overlay p { font-size: 14px; opacity: 0.9; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 20; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-center-btn { background: #fe2c55; color: #fff; border: none; width: 45px; height: 28px; border-radius: 8px; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; text-decoration: none; }

        /* Upload Modal Popup */
        #uploadModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { font-size: 18px; color: #fff; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btns button { padding: 8px 16px; border: none; border-radius: 6px; cursor: font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #444; color: #fff; }
        .btn-submit { background: #fe2c55; color: #fff; }
    </style>
</head>
<body>

    <div class="reel-container" id="videoContainer">
        <!-- Video Element -->
        <video id="mainVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline></video>

        <!-- Right Sidebar (Like, Comment, Favorite, Share) -->
        <div class="sidebar">
            <div class="action-btn profile-icon">
                <div class="icon">👤</div>
                <div class="add-badge">+</div>
            </div>
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                <div class="icon" id="likeIcon">❤️</div>
                <span id="likeCount">12.5K</span>
            </button>
            <button class="action-btn" onclick="alert('Comments section coming up!')">
                <div class="icon">💬</div>
                <span>743</span>
            </button>
            <button class="action-btn" id="favBtn" onclick="toggleFav()">
                <div class="icon">⭐</div>
                <span id="favCount">568</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                <div class="icon">↗️</div>
                <span>202</span>
            </button>
        </div>

        <!-- User details and description -->
        <div class="overlay">
            <h3>@fx_trader</h3>
            <p>FX Master Live Trade #trading #crypto</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="/" class="nav-item active">🏠 Home</a>
        <a href="#" class="nav-item" onclick="alert('Friends feed coming soon!')">👥 Friends</a>
        <a href="#" class="nav-center-btn" onclick="openUploadModal(event)">+</a>
        <a href="#" class="nav-item" onclick="alert('No new messages')">💬 Inbox</a>
        <a href="#" class="nav-item" onclick="alert('Profile settings')">👤 Profile</a>
    </div>

    <!-- Upload Popup Modal -->
    <div id="uploadModal">
        <div class="modal-content">
            <h3>Post New Trading Video</h3>
            <input type="text" id="videoTitle" placeholder="Enter caption / hashtags...">
            <input type="file" id="videoFile" accept="video/*">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeUploadModal()">Cancel</button>
                <button class="btn-submit" onclick="uploadVideo()">Post</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const container = document.getElementById('videoContainer');

        // Play/Pause on tapping the video
        container.addEventListener('click', function(e) {
            // Prevent triggering if clicked on buttons
            if(e.target.closest('.sidebar') || e.target.closest('.bottom-nav') || e.target.closest('#uploadModal')) return;
            
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });

        // Auto play on load
        window.addEventListener('load', () => {
            video.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        });

        let isLiked = false;
        function toggleLike() {
            isLiked = !isLiked;
            const btn = document.getElementById('likeBtn');
            const countSpan = document.getElementById('likeCount');
            if (isLiked) {
                btn.classList.add('liked');
                countSpan.innerText = '12,501';
            } else {
                btn.classList.remove('liked');
                countSpan.innerText = '12.5K';
            }
        }

        let isFav = false;
        function toggleFav() {
            isFav = !isFav;
            const btn = document.getElementById('favBtn');
            const countSpan = document.getElementById('favCount');
            if (isFav) {
                btn.style.color = '#f5c518';
                countSpan.innerText = '569';
            } else {
                btn.style.color = '#fff';
                countSpan.innerText = '568';
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'FX Master Reel',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert('Link copied to clipboard!');
            }
        }

        function openUploadModal(e) {
            e.preventDefault();
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }

        function uploadVideo() {
            const title = document.getElementById('videoTitle').value;
            const fileInput = document.getElementById('videoFile');
            if(fileInput.files.length === 0) {
                alert('Please select a video file first!');
                return;
            }
            alert('Video "' + (title || 'Untitled') + '" uploaded successfully! (Mock Action)');
            closeUploadModal();
        }
    </script>
</body>
</html>
