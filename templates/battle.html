<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        .reel-container { position: relative; width: 100vw; height: calc(100vh - 60px); display: flex; justify-content: center; align-items: center; background: #111; }
        
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Right Sidebar Actions */
        .sidebar { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 30; }
        .action-btn { background: none; border: none; color: #fff; text-align: center; cursor: pointer; font-size: 12px; pointer-events: auto; }
        .icon { width: 40px; height: 40px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; margin-bottom: 4px; }
        .liked { color: #fe2c55 !important; }
        .liked .icon { background: rgba(254,44,85,0.3); }

        /* Profile icon with plus */
        .profile-icon { position: relative; }
        .profile-icon .add-badge { position: absolute; bottom: -2px; right: 50%; background: #fe2c55; width: 18px; height: 18px; border-radius: 50%; font-size: 14px; display: flex; justify-content: center; align-items: center; font-weight: bold; transform: translateX(50%); }

        /* Bottom Info Overlay */
        .overlay { position: absolute; bottom: 20px; left: 15px; right: 80px; z-index: 20; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none; }
        .overlay h3 { font-size: 16px; margin-bottom: 6px; }
        .overlay p { font-size: 14px; opacity: 0.9; }

        /* Bottom Navigation Bar - Fixed at bottom */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 40; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: #fff; }
        .nav-center-btn { background: #fe2c55; color: #fff; border: none; width: 45px; height: 28px; border-radius: 8px; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; text-decoration: none; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { font-size: 18px; color: #fff; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btns button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #444; color: #fff; }
        .btn-submit { background: #fe2c55; color: #fff; }

        /* Comments List */
        .comments-list { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; text-align: left; }
        .comment-item { background: #333; padding: 8px; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="reel-container" id="videoContainer">
        <!-- Video Element -->
        <video id="mainVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop playsinline></video>

        <!-- Right Sidebar -->
        <div class="sidebar">
            <div class="action-btn profile-icon" onclick="openProfile()">
                <div class="icon">👤</div>
                <div class="add-badge">+</div>
            </div>
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                <div class="icon" id="likeIcon">❤️</div>
                <span id="likeCount">0</span>
            </button>
            <button class="action-btn" onclick="openCommentModal()">
                <div class="icon">💬</div>
                <span id="commentCount">1</span>
            </button>
            <button class="action-btn" id="favBtn" onclick="toggleFav()">
                <div class="icon">⭐</div>
                <span id="favCount">0</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                <div class="icon">↗️</div>
                <span id="shareCount">0</span>
            </button>
        </div>

        <!-- User details and description -->
        <div class="overlay">
            <h3 id="usernameDisplay">@fx_trader</h3>
            <p id="captionDisplay">FX Master Live Trade #trading #crypto</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">🏠 Home</button>
        <button class="nav-item" onclick="switchTab('friends')">👥 Friends</button>
        <button class="nav-center-btn" onclick="openUploadModal(event)">+</button>
        <button class="nav-item" onclick="switchTab('inbox')">💬 Inbox</button>
        <button class="nav-item" onclick="switchTab('profile')">👤 Profile</button>
    </div>

    <!-- Upload Popup Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3>Post New Trading Video</h3>
            <input type="text" id="videoTitle" placeholder="Enter caption / hashtags...">
            <input type="file" id="videoFile" accept="video/*">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeUploadModal()">Cancel</button>
                <button class="btn-submit" onclick="submitVideoLocal()">Post</button>
            </div>
        </div>
    </div>

    <!-- Comment Popup Modal -->
    <div id="commentModal" class="modal">
        <div class="modal-content">
            <h3>Comments</h3>
            <div class="comments-list" id="commentsList">
                <div class="comment-item"><b>@crypto_king:</b> Awesome trade setup! 🔥</div>
            </div>
            <input type="text" id="newCommentInput" placeholder="Add a comment...">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeCommentModal()">Close</button>
                <button class="btn-submit" onclick="addComment()">Post</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const container = document.getElementById('videoContainer');

        container.addEventListener('click', function(e) {
            if(video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });

        window.addEventListener('load', () => {
            video.play().catch(err => console.log("Autoplay blocked:", err));
        });

        let isLiked = false;
        function toggleLike() {
            event.stopPropagation();
            isLiked = !isLiked;
            const btn = document.getElementById('likeBtn');
            const countSpan = document.getElementById('likeCount');
            if (isLiked) {
                btn.classList.add('liked');
                countSpan.innerText = '1';
            } else {
                btn.classList.remove('liked');
                countSpan.innerText = '0';
            }
        }

        let isFav = false;
        function toggleFav() {
            event.stopPropagation();
            isFav = !isFav;
            const btn = document.getElementById('favBtn');
            const countSpan = document.getElementById('favCount');
            if (isFav) {
                btn.style.color = '#f5c518';
                countSpan.innerText = '1';
            } else {
                btn.style.color = '#fff';
                countSpan.innerText = '0';
            }
        }

        function shareVideo() {
            event.stopPropagation();
            const shareSpan = document.getElementById('shareCount');
            shareSpan.innerText = parseInt(shareSpan.innerText) + 1;
            if (navigator.share) {
                navigator.share({ title: 'FX Master Reel', url: window.location.href }).catch(console.error);
            } else {
                alert('Link copied to clipboard!');
            }
        }

        function openUploadModal(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }

        function submitVideoLocal() {
            const titleInput = document.getElementById('videoTitle').value;
            const fileInput = document.getElementById('videoFile');

            if(fileInput.files.length === 0) {
                alert('Please select a video file first!');
                return;
            }

            const file = fileInput.files[0];
            const videoUrl = URL.createObjectURL(file);

            // Set video source to selected local video and play
            video.src = videoUrl;
            video.load();
            video.play();

            // Update caption and reset counts
            if(titleInput) {
                document.getElementById('captionDisplay').innerText = titleInput;
            }
            document.getElementById('likeCount').innerText = '0';
            document.getElementById('commentCount').innerText = '0';
            document.getElementById('favCount').innerText = '0';
            document.getElementById('shareCount').innerText = '0';
            isLiked = false;
            isFav = false;
            document.getElementById('likeBtn').classList.remove('liked');
            document.getElementById('favBtn').style.color = '#fff';

            closeUploadModal();
            alert('Video posted successfully and playing now!');
        }

        function openCommentModal() {
            document.getElementById('commentModal').style.display = 'flex';
        }

        function closeCommentModal() {
            document.getElementById('commentModal').style.display = 'none';
        }

        function addComment() {
            const input = document.getElementById('newCommentInput');
            if(!input.value.trim()) return;
            
            const list = document.getElementById('commentsList');
            const newItem = document.createElement('div');
            newItem.className = 'comment-item';
            newItem.innerHTML = `<b>@you:</b> ${input.value}`;
            list.appendChild(newItem);
            
            const countSpan = document.getElementById('commentCount');
            countSpan.innerText = parseInt(countSpan.innerText) + 1;
            input.value = '';
        }

        function openProfile() {
            alert('Opening FX Trader Profile');
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(tab !== 'home') {
                alert('Switched to ' + tab);
            }
        }
    </script>
</body>
</html>
