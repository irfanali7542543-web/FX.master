<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        .reel-container { position: relative; width: 100vw; height: calc(100vh - 60px); display: flex; justify-content: center; align-items: center; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Right Sidebar Actions */
        .sidebar { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { background: none; border: none; color: #fff; text-align: center; cursor: pointer; font-size: 12px; }
        .icon { width: 40px; height: 40px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; margin-bottom: 4px; }
        
        /* Profile icon with plus */
        .profile-icon { position: relative; }
        .profile-icon .add-badge { position: absolute; bottom: -2px; right: 50% / 2; background: #fe2c55; width: 18px; height: 18px; border-radius: 50%; font-size: 14px; display: flex; justify-content: center; align-items: center; font-weight: bold; transform: translateX(50%); }

        /* Bottom Info Overlay */
        .overlay { position: absolute; bottom: 20px; left: 15px; right: 80px; z-index: 10; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .overlay h3 { font-size: 16px; margin-bottom: 6px; }
        .overlay p { font-size: 14px; opacity: 0.9; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 20; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #fff; }
        .nav-center-btn { background: #fe2c55; color: #fff; border: none; width: 45px; height: 28px; border-radius: 8px; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

    <div class="reel-container">
        <!-- Video Element -->
        <video src="{{ url_for('static', filename=current_video) }}" autoplay loop playsinline controls></video>

        <!-- Right Sidebar (Like, Comment, Favorite, Share) -->
        <div class="sidebar">
            <div class="action-btn profile-icon">
                <div class="icon">👤</div>
                <div class="add-badge">+</div>
            </div>
            <button class="action-btn">
                <div class="icon">❤️</div>
                <span>12.5K</span>
            </button>
            <button class="action-btn">
                <div class="icon">💬</div>
                <span>743</span>
            </button>
            <button class="action-btn">
                <div class="icon">⭐</div>
                <span>568</span>
            </button>
            <button class="action-btn">
                <div class="icon">↗️</div>
                <span>202</span>
            </button>
        </div>

        <!-- User details and description -->
        <div class="overlay">
            <h3>@fx_trader</h3>
            <p>FX Master Live Trade #trading #crypto</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="/" class="nav-item active">🏠 Home</a>
        <a href="#" class="nav-item">👥 Friends</a>
        <button class="nav-center-btn">+</button>
        <a href="#" class="nav-item">💬 Inbox</a>
        <a href="#" class="nav-item">👤 Profile</a>
    </div>

</body>
</html>
